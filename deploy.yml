# 워크플로우의 이름입니다. 깃허브 Actions 탭에서 이 이름으로 표시됩니다.
name: Deploy to GitHub Pages

# 워크플로우가 언제 실행될지(트리거) 정의합니다.
on:
  # main 또는 master 브랜치에 코드가 push(업로드) 될 때마다 자동으로 실행됩니다.
  push:
    branches: ['main', 'master']
  # 깃허브 웹사이트(Actions 탭)에서 수동으로 이 워크플로우를 실행할 수 있게 해주는 버튼을 생성합니다.
  workflow_dispatch: 

# 워크플로우가 깃허브 저장소에 접근하거나 수정할 수 있는 권한을 설정합니다.
permissions:
  contents: read # 코드를 읽을 수 있는 권한
  pages: write # GitHub Pages에 배포할 수 있는 권한
  id-token: write # 인증을 위한 토큰 생성 권한

# 동시에 여러 번 푸시가 일어났을 때의 동작을 제어합니다.
concurrency:
  group: 'pages' # 동일한 'pages' 그룹으로 묶습니다.
  cancel-in-progress: true # 진행 중인 이전 배포 작업이 있다면 취소하고 가장 최신 작업만 우선 실행합니다.

# 실제 실행될 작업(Job)들의 목록입니다.
jobs:
  # 'deploy'라는 이름의 단일 작업(Job)을 정의합니다.
  deploy:
    # GitHub Pages 배포 환경을 사용하도록 지정하며, 배포 완료 후 결과 URL을 출력으로 받아옵니다.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 이 작업이 실행될 가상 서버 환경(운영체제)을 최신 우분투(리눅스)로 지정합니다.
    runs-on: ubuntu-latest
    # 작업 내에서 순서대로 실행될 단계(Steps)들입니다.
    steps:
      - name: Checkout # 1. 깃허브 저장소에서 코드를 서버로 내려받습니다.
        uses: actions/checkout@v4
      - name: Set up Node # 2. Node.js 환경을 설치합니다.
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Node.js 20 버전을 사용합니다.
          cache: 'npm' # npm 패키지 설치 속도를 높이기 위해 캐시를 사용합니다.
      - name: Install dependencies # 3. package.json에 정의된 라이브러리들을 설치합니다.
        run: npm install
      - name: Build # 4. React(Vite) 프로젝트를 배포용(dist 폴더)으로 압축 및 빌드합니다.
        run: npm run build
      - name: Setup Pages # 5. GitHub Pages 환경을 준비합니다.
        uses: actions/configure-pages@v4
      - name: Upload artifact # 6. 빌드된 결과물(dist 폴더)을 배포용 아티팩트 파일로 업로드합니다.
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite의 기본 빌드 결과물이 담기는 폴더 경로입니다.
      - name: Deploy to GitHub Pages # 7. 업로드된 아티팩트를 실제 GitHub Pages 서버에 최종 배포합니다.
        id: deployment
        uses: actions/deploy-pages@v4